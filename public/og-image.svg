<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1e3a5f"/>
  <!-- Gold accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#d4a84b"/>
  <!-- Company name -->
  <text x="600" y="240" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="56" fill="#ffffff">Keystone Security Distribution</text>
  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="Open Sans, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#a0b4cc">Your Mid-Atlantic Security Partner Since 1987</text>
  <!-- Gold divider -->
  <rect x="450" y="350" width="300" height="3" rx="1.5" fill="#d4a84b"/>
  <!-- Service states -->
  <text x="600" y="410" text-anchor="middle" font-family="Open Sans, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#d4a84b">PA  |  NJ  |  MD  |  VA  |  DE  |  DC</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="#d4a84b"/>
</svg>
