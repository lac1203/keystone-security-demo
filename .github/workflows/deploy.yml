name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build check
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chunk | Raw (KB) | Gzip (KB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          total_raw=0
          total_gzip=0
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            raw=$(wc -c < "$f")
            raw_kb=$(awk "BEGIN {printf \"%.1f\", $raw / 1024}")
            gzip_size=$(gzip -c "$f" | wc -c)
            gzip_kb=$(awk "BEGIN {printf \"%.1f\", $gzip_size / 1024}")
            echo "| $name | $raw_kb | $gzip_kb |" >> "$GITHUB_STEP_SUMMARY"
            total_raw=$((total_raw + raw))
            total_gzip=$((total_gzip + gzip_size))
          done
          total_raw_kb=$(awk "BEGIN {printf \"%.1f\", $total_raw / 1024}")
          total_gzip_kb=$(awk "BEGIN {printf \"%.1f\", $total_gzip / 1024}")
          echo "| **Total** | **$total_raw_kb** | **$total_gzip_kb** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Check bundle budget
        run: |
          MAX_GZIP_BYTES=$((150 * 1024))
          fail=0
          for f in dist/assets/*.js; do
            name=$(basename "$f")
            gzip_size=$(gzip -c "$f" | wc -c)
            if [ "$gzip_size" -gt "$MAX_GZIP_BYTES" ]; then
              gzip_kb=$(awk "BEGIN {printf \"%.1f\", $gzip_size / 1024}")
              echo "::error::$name exceeds 150KB gzip budget (${gzip_kb}KB)"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "All JS chunks are within the 150KB gzip budget."

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
